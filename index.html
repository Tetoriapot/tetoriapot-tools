<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="TeToriapot Tools - 創作や日常を支える小さなツールまとめ" />
  <title>TeToriapot Tools</title>
  <link rel="canonical" href="https://tetoriapot.github.io/tetoriapot-tools/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="TeToriapot Tools" />
  <meta property="og:description" content="創作や日常を支える、小さなツール置き場です。" />
  <meta property="og:url" content="https://tetoriapot.github.io/tetoriapot-tools/" />
  <meta property="og:site_name" content="TeToriapot Tools" />
  <meta property="og:locale" content="ja_JP" />
  <link rel="icon" href="./assets/img/favicon.svg" type="image/svg+xml" />
  <script src="./assets/js/theme.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Orbitron:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./assets/css/style.css?v=20260926-compact-filters" />
</head>
<body id="top">
  <a class="skip-link" href="#main">本文へ移動</a>

  <header class="site-header">
    <div class="container header-utilities">
      <button class="text-button" id="updatesToggle" type="button" aria-haspopup="dialog" aria-controls="updatesDialog" aria-expanded="false">更新履歴</button>
      <div class="font-size-controls" id="fontSizeControls" role="group" aria-label="文字サイズ">
        <span class="font-size-label" aria-hidden="true">文字<span class="font-size-label-detail">サイズ</span></span>
        <button class="text-button" type="button" data-font-size="small" aria-label="文字サイズ：小" aria-pressed="false">小</button>
        <button class="text-button" type="button" data-font-size="normal" aria-label="文字サイズ：標準" aria-pressed="true">標準</button>
        <button class="text-button" type="button" data-font-size="large" aria-label="文字サイズ：大" aria-pressed="false">大</button>
      </div>
    </div>
    <div class="container header-inner">
      <h1 class="brand-heading"><a class="brand" href="#top" aria-label="TeToriapot Tools トップへ">TeToriapot Tools</a></h1>
      <nav class="global-nav" aria-label="メインナビゲーション">
        <a href="#top">TOP</a>
        <a href="#tools">TOOLS</a>
        <a href="#category">CATEGORY</a>
      </nav>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="ライトモード" aria-pressed="false">
        <span class="theme-icon" aria-hidden="true">☾</span>
        <span class="theme-text">Dark</span>
      </button>
    </div>
  </header>

  <dialog class="updates-dialog" id="updatesDialog" aria-labelledby="updatesHeading">
    <div class="dialog-heading">
      <h2 id="updatesHeading">更新履歴</h2>
      <form method="dialog">
        <button class="text-button" type="submit" autofocus>閉じる</button>
      </form>
    </div>
    <ul id="updatesList" class="updates-list"></ul>
  </dialog>

  <main id="main">
    <section class="about-section" id="about" aria-label="このサイトについて">
      <div class="container about-inline">
        <p>自作のWebツールをまとめています。</p>
        <a class="text-link" href="https://tetoriapot.sakura.ne.jp/">← TeToriapot 本館へ</a>
      </div>
    </section>

    <section class="search-section" aria-labelledby="searchHeading">
      <div class="container">
        <div class="panel search-panel">
          <h2 id="searchHeading" class="sr-only">ツール検索</h2>
          <label class="search-label" for="toolSearch">ツールを検索</label>
          <div class="search-row">
            <input id="toolSearch" type="search" placeholder="名前・タグ・説明から検索" autocomplete="off" aria-controls="toolGrid" />
            <button id="clearSearch" class="button button-subtle" type="button">クリア</button>
          </div>
          <p id="resultSummary" class="result-summary" role="status" aria-live="polite" aria-atomic="true"></p>
          <noscript><p>ツール一覧の表示と検索にはJavaScriptを有効にしてください。</p></noscript>
        </div>
      </div>
    </section>

    <section class="category-section" id="category" aria-labelledby="categoryHeading">
      <div class="container">
        <div class="section-heading">
          <h2 id="categoryHeading">カテゴリ</h2>
        </div>
        <div id="categoryList" class="category-grid" role="group" aria-label="カテゴリで絞り込む"></div>
      </div>
    </section>

    <section class="tools-section" id="tools" aria-labelledby="toolsHeading">
      <div class="container">
        <div class="section-heading section-heading-tools">
          <h2 id="toolsHeading">ツール</h2>
          <button id="showAll" class="text-button" type="button">すべて表示</button>
        </div>
        <div id="toolGrid" class="tool-grid"></div>
        <p id="emptyState" class="empty-state" hidden>該当するツールがありません。</p>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>© TeToriapot</p>
    </div>
  </footer>

  <script type="module" src="./assets/js/main.js?v=20260926-about"></script>
</body>
</html>
